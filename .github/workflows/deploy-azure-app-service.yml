name: Deploy Great Britain Grid Dashboard to Azure

on:
  push:
    branches:
      - main
    paths:
      - "app_service/**"
      - ".github/workflows/deploy-azure-app-service.yml"
      - "README.md"
      - "docs/azure_app_service_deployment.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gb-grid-congestion-production-deployment
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: gb-grid-congestion-kamil-898341
  PYTHON_VERSION: "3.12"
  PUBLIC_HEALTH_URL: https://gb-grid-congestion-kamil-898341.azurewebsites.net/health

jobs:
  deploy:
    name: Validate and deploy dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Python source
        run: |
          python -m py_compile app_service/app.py
          python -m py_compile app_service/database.py
          python -m py_compile app_service/visuals.py
          python -m py_compile app_service/components.py

      - name: Create Azure deployment package
        working-directory: app_service
        run: |
          zip -r ../azure-release.zip \
            app.py \
            database.py \
            visuals.py \
            components.py \
            requirements.txt \
            assets

      - name: Sign in to Azure using OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy dashboard to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: azure-release.zip

      - name: Validate public health endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          health_url = os.environ["PUBLIC_HEALTH_URL"]
          last_error = None

          for attempt in range(1, 37):
              try:
                  request = urllib.request.Request(
                      health_url,
                      headers={
                          "User-Agent": "GitHubActionsHealthCheck/1.0"
                      },
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:
                      payload = json.loads(
                          response.read().decode("utf-8")
                      )

                  if (
                      response.status == 200
                      and payload.get(
                          "status"
                      ) == "healthy"
                      and payload.get(
                          "database_connection"
                      ) == "Passed"
                      and payload.get(
                          "approved_view_count"
                      ) == 11
                  ):
                      print(
                          "Public dashboard health check passed."
                      )
                      break

              except Exception as error:
                  last_error = str(error)

              print(
                  f"Waiting for dashboard health, attempt {attempt} of 36"
              )
              time.sleep(10)

          else:
              raise RuntimeError(
                  "The public dashboard did not become healthy. "
                  f"Last error: {last_error}"
              )
          PY

      - name: Sign out of Azure
        if: always()
        run: az logout
